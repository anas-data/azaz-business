name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Repository policy checks
        run: |
          test -f docs/security/001-security-baseline.md
          test -f docs/architecture/003-offline-sync.md
          test -f database/migrations/001_core.sql
